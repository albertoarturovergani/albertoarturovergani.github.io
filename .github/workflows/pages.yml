name: Publish academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate publication data from BibTeX
        run: python scripts/build_data.py

      - name: Assemble static site
        run: |
          mkdir -p dist
          cp index.html cv.html publications.html .nojekyll vergani_scholar.bib dist/
          cp -R assets data dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
